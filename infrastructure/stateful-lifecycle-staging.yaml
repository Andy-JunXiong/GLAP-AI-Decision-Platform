AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Isolated GLAP stateful lifecycle staging writer. It has no schedule and is not
  connected to the production success-gated controller. Its separate manual
  integration controller proves lifecycle and v2 compatibility gates in order.

Parameters:
  ArtifactBucket:
    Type: String
  GeneratorArtifactKey:
    Type: String
  ControllerArtifactKey:
    Type: String
  QualityGateArtifactKey:
    Type: String
  ActionMutationArtifactKey:
    Type: String
  AthenaOutputUri:
    Type: String
    AllowedPattern: ^s3://[^/]+/.+$
  AthenaResultsBucketName:
    Type: String
  AthenaResultsPrefix:
    Type: String
  LifecycleDataBucketArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:s3:::[^/]+$
  LifecycleDataObjectArn:
    Type: String
    Description: Prefix-scoped object ARN ending in /* for lifecycle staging only.
    AllowedPattern: ^arn:[^:]+:s3:::[^/]+/.+\*$
  PipelineStatusS3Uri:
    Type: String
    AllowedPattern: ^s3://[^/]+/.+$
  PipelineStatusObjectArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:s3:::[^/]+/.+$
  PipelineStatusObjectsArn:
    Type: String
    Description: Prefix-scoped status object ARN ending in /* for isolated scenarios.
    AllowedPattern: ^arn:[^:]+:s3:::[^/]+/.+\*$
  PipelineStatusPrefix:
    Type: String
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9!_.*'()/=-]+$
  AthenaWorkgroup:
    Type: String
    Default: primary
  SourceDatabase:
    Type: String
    Default: simulated_iceberg_m
  FunctionName:
    Type: String
    Default: glap-stateful-lifecycle-generator-staging
  ExecutionRoleName:
    Type: String
    Default: glap-stateful-lifecycle-generator-staging-role
  IntegrationControllerFunctionName:
    Type: String
    Default: glap-stateful-lifecycle-controller-staging
  IntegrationControllerRoleName:
    Type: String
    Default: glap-stateful-lifecycle-controller-staging-role
  IntegrationQualityGateFunctionName:
    Type: String
    Default: glap-stateful-lifecycle-quality-gate-staging
  IntegrationQualityGateRoleName:
    Type: String
    Default: glap-stateful-lifecycle-quality-gate-staging-role
  ActionMutationFunctionName:
    Type: String
    Default: glap-lifecycle-action-mutation-staging
  ActionMutationRoleName:
    Type: String
    Default: glap-lifecycle-action-mutation-staging-role

Resources:
  ActionMutationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ActionMutationRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrivateActionMutationOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ActionMutationFunctionName}:*
              - Sid: RunAthena
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkgroup}
              - Sid: ReadActionCatalog
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${SourceDatabase}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_audit_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_action_current_staging_v1
              - Sid: ReadWritePrivateLifecyclePrefix
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Ref LifecycleDataObjectArn
              - Sid: ListPrivateLifecycleBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Ref LifecycleDataBucketArn
              - Sid: UseAthenaResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${AthenaResultsBucketName}/${AthenaResultsPrefix}*
              - Sid: LocateAthenaResults
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${AthenaResultsBucketName}

  ActionMutationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref ActionMutationFunctionName
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ActionMutationRole.Arn
      Timeout: 180
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ActionMutationArtifactKey
      Environment:
        Variables:
          ATHENA_SOURCE_DATABASE: !Ref SourceDatabase
          ATHENA_WORKGROUP: !Ref AthenaWorkgroup
          ATHENA_OUTPUT: !Ref AthenaOutputUri
          LIFECYCLE_ACTION_CURRENT_VIEW: vw_lifecycle_action_current_staging_v1
          LIFECYCLE_ACTION_AUDIT_TABLE: fact_lifecycle_action_audit_staging_v1
          PIPELINE_ENVIRONMENT: staging
          ALLOW_FUTURE_SIMULATION: "true"

  LifecycleGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ExecutionRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LifecycleStagingOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
              - Sid: RunAthena
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkgroup}
              - Sid: ReadLifecycleCatalog
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                  - glue:UpdateTable
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${SourceDatabase}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_lifecycle_target_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_route_service_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_rate_card_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_rate_tier_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_fx_rate_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_provider_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_event_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_cost_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_metrics_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_signal_candidate_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_alert_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_outcome_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_policy_proposal_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_audit_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_action_current_staging_v1
              - Sid: UseLakeFormation
                Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: "*"
              - Sid: ListLifecycleBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Ref LifecycleDataBucketArn
              - Sid: ReadWriteLifecyclePrefix
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Ref LifecycleDataObjectArn
              - Sid: UseAthenaResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${AthenaResultsBucketName}/${AthenaResultsPrefix}*
              - Sid: LocateAthenaResults
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${AthenaResultsBucketName}

  LifecycleGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LifecycleGeneratorRole.Arn
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref GeneratorArtifactKey
      Environment:
        Variables:
          ATHENA_SOURCE_DATABASE: !Ref SourceDatabase
          ATHENA_WORKGROUP: !Ref AthenaWorkgroup
          ATHENA_OUTPUT: !Ref AthenaOutputUri
          SHIPMENT_TABLE: fact_shipment_lifecycle_staging_v1
          SHIPMENT_EVENT_TABLE: fact_shipment_lifecycle_event_staging_v1
          SHIPMENT_COST_TABLE: fact_shipment_cost_staging_v1
          SHIPMENT_METRICS_TABLE: fact_shipment_lifecycle_metrics_staging_v1
          SHIPMENT_SIGNAL_TABLE: fact_shipment_signal_candidate_staging_v1
          LIFECYCLE_ALERT_TABLE: fact_lifecycle_alert_staging_v1
          LIFECYCLE_ACTION_TABLE: fact_lifecycle_action_staging_v1
          LIFECYCLE_OUTCOME_TABLE: fact_lifecycle_outcome_staging_v1
          POLICY_PROPOSAL_TABLE: fact_policy_proposal_staging_v1
          LIFECYCLE_ACTION_CURRENT_VIEW: vw_lifecycle_action_current_staging_v1
          ROUTE_SERVICE_TABLE: dim_route_service_v1
          LIFECYCLE_TARGET_TABLE: dim_lifecycle_target_v1
          RATE_CARD_TABLE: dim_rate_card_v1
          FX_RATE_TABLE: dim_fx_rate_v1
          DEFAULT_REPORTING_CURRENCY: AUD
          PIPELINE_ENVIRONMENT: staging
          ALLOW_FUTURE_SIMULATION: "true"

  LifecycleGeneratorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GLAP isolated stateful lifecycle staging writer failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LifecycleGeneratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IntegrationQualityGateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref IntegrationQualityGateRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LifecycleCompatibilityReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${IntegrationQualityGateFunctionName}:*
              - Sid: RunAthenaChecks
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkgroup}
              - Sid: ReadLifecycleContracts
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${SourceDatabase}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_lifecycle_target_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_route_service_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_rate_card_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_rate_tier_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_fx_rate_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/dim_provider_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_event_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_cost_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_metrics_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_signal_candidate_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_alert_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_outcome_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_policy_proposal_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_audit_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_action_current_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_shipment_v2_compat
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_shipment_event_v2_compat
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_leg_metrics_v2_compat
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_cost_v2_compat
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_risk_v2_compat
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_product_allocation_v2_compat
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_shipment_v2_compat_context
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_shipment_event_v2_compat_context
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_leg_metrics_v2_compat_context
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_cost_v2_compat_context
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_risk_v2_compat_context
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_product_allocation_v2_compat_context
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_shipment_daily_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_ops_daily_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_provider_daily_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_mode_decision_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_forecast_feature_daily_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_outcome_label_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_shipment_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_ops_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_provider_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_mode_decision_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_forecast_feature_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_outcome_label_context_v1
              - Sid: UseLakeFormation
                Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: "*"
              - Sid: ListLifecycleBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Ref LifecycleDataBucketArn
              - Sid: ReadLifecyclePrefix
                Effect: Allow
                Action: s3:GetObject
                Resource: !Ref LifecycleDataObjectArn
              - Sid: UseAthenaResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${AthenaResultsBucketName}/${AthenaResultsPrefix}*
              - Sid: LocateAthenaResults
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${AthenaResultsBucketName}

  IntegrationQualityGateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref IntegrationQualityGateFunctionName
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt IntegrationQualityGateRole.Arn
      Timeout: 180
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref QualityGateArtifactKey
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref SourceDatabase
          ATHENA_SOURCE_DATABASE: !Ref SourceDatabase
          ATHENA_OUTPUT: !Ref AthenaOutputUri
          ATHENA_WORKGROUP: !Ref AthenaWorkgroup
          MAX_VOLUME_CHANGE_PCT: 50

  IntegrationControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref IntegrationControllerRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLifecycleIntegrationOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${IntegrationControllerFunctionName}:*
              - Sid: InvokeConfiguredStages
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt LifecycleGeneratorFunction.Arn
                  - !GetAtt IntegrationQualityGateFunction.Arn
              - Sid: PersistPrivateStatus
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Ref PipelineStatusObjectArn
                  - !Ref PipelineStatusObjectsArn
              - Sid: FindPrivateStatus
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref LifecycleDataBucketArn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref PipelineStatusPrefix
                      - !Sub ${PipelineStatusPrefix}/*

  IntegrationControllerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref IntegrationControllerFunctionName
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt IntegrationControllerRole.Arn
      Timeout: 900
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ControllerArtifactKey
      Environment:
        Variables:
          PIPELINE_TIMEZONE: Australia/Sydney
          PIPELINE_ENVIRONMENT: staging
          ALLOW_FUTURE_SIMULATION: "true"
          PIPELINE_STATUS_S3_URI: !Ref PipelineStatusS3Uri
          PIPELINE_STAGES_JSON: !Sub >-
            [{"name":"stateful_lifecycle_generation","function_name":"${FunctionName}"},
            {"name":"lifecycle_validation","function_name":"${IntegrationQualityGateFunctionName}","quality_contract":"lifecycle_v1"},
            {"name":"input_validation","function_name":"${IntegrationQualityGateFunctionName}","quality_contract":"lifecycle_compat_v2"},
            {"name":"analytics_validation","function_name":"${IntegrationQualityGateFunctionName}","quality_contract":"multimodal_analytics_v1"}]

Outputs:
  LifecycleGeneratorFunctionName:
    Value: !Ref LifecycleGeneratorFunction
  LifecycleGeneratorRoleArn:
    Value: !GetAtt LifecycleGeneratorRole.Arn
  IntegrationControllerFunctionName:
    Value: !Ref IntegrationControllerFunction
  IntegrationQualityGateFunctionName:
    Value: !Ref IntegrationQualityGateFunction
  PipelineStatusS3Uri:
    Value: !Ref PipelineStatusS3Uri
