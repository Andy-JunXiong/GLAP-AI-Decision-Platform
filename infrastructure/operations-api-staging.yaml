AWSTemplateFormatVersion: "2010-09-09"
Description: Authenticated, internal-only GLAP Operations API for staging Risks, Actions, Action evidence, Outcomes, Learning evidence, Network Drill-down, Forecasts, and Pipeline Health.

Parameters:
  ArtifactBucket: {Type: String}
  ApiArtifactKey: {Type: String}
  JwtIssuer: {Type: String}
  JwtAudience: {Type: String}
  ActionMutationFunctionName: {Type: String, Default: glap-lifecycle-action-mutation-staging}
  AthenaOutputUri: {Type: String, AllowedPattern: '^s3://[^/]+/.+$'}
  AthenaResultsBucketArn: {Type: String}
  AthenaWorkgroup: {Type: String, Default: primary}
  SourceDatabase: {Type: String, Default: simulated_iceberg_m}
  LifecycleDataBucketArn: {Type: String}
  PipelineStatusS3Uri: {Type: String, AllowedPattern: '^s3://[^/]+/.+$'}
  PipelineStatusObjectArn: {Type: String, AllowedPattern: '^arn:[^:]+:s3:::[^/]+/.+$'}
  AllowedOrigin: {Type: String, Default: 'https://example.invalid'}

Resources:
  OperationsApiDLQ:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  OperationsApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OperationsApiLeastPrivilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/glap-operations-api-staging:*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ActionMutationFunctionName}
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:StopQueryExecution]
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkgroup}
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetTable, glue:GetPartitions]
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${SourceDatabase}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_lifecycle_action_current_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_audit_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_action_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_alert_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_lifecycle_outcome_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_policy_proposal_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_forecast_feature_daily_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_shipment_daily_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_forecast_feature_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_provider_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/vw_multimodal_shipment_daily_context_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_staging_v1
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabase}/fact_shipment_lifecycle_metrics_staging_v1
              - Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !Ref LifecycleDataBucketArn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub ${AthenaResultsBucketArn}/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Ref PipelineStatusObjectArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OperationsApiDLQ.Arn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: GLAP/OperationsApi

  OperationsApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: glap-operations-api-staging
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt OperationsApiRole.Arn
      Timeout: 35
      MemorySize: 256
      DeadLetterConfig: {TargetArn: !GetAtt OperationsApiDLQ.Arn}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ApiArtifactKey}
      Environment:
        Variables:
          ACTION_MUTATION_FUNCTION: !Ref ActionMutationFunctionName
          ATHENA_OUTPUT: !Ref AthenaOutputUri
          ATHENA_WORKGROUP: !Ref AthenaWorkgroup
          ATHENA_SOURCE_DATABASE: !Ref SourceDatabase
          LIFECYCLE_ALERT_TABLE: fact_lifecycle_alert_staging_v1
          LIFECYCLE_OUTCOME_TABLE: fact_lifecycle_outcome_staging_v1
          POLICY_PROPOSAL_TABLE: fact_policy_proposal_staging_v1
          MINIMUM_POLICY_OUTCOMES: '20'
          LIFECYCLE_ACTION_CURRENT_VIEW: vw_lifecycle_action_current_staging_v1
          LIFECYCLE_ACTION_AUDIT_TABLE: fact_lifecycle_action_audit_staging_v1
          LIFECYCLE_ACTION_TABLE: fact_lifecycle_action_staging_v1
          FORECAST_SOURCE_TABLE: vw_multimodal_forecast_feature_daily_v1
          NETWORK_SOURCE_VIEW: vw_multimodal_shipment_daily_v1
          PIPELINE_STATUS_S3_URI: !Ref PipelineStatusS3Uri

  OperationsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: glap-operations-api-staging
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  OperationsApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/glap-operations-api-staging/access
      RetentionInDays: 14

  OperationsApiThrottleMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref OperationsApiAccessLogGroup
      FilterPattern: '{ $.status = 429 }'
      MetricTransformations:
        - MetricNamespace: GLAP/OperationsApi
          MetricName: ThrottleResponses
          MetricValue: '1'
          DefaultValue: 0

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref OperationsApi
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      Name: internal-jwt
      JwtConfiguration:
        Audience: [!Ref JwtAudience]
        Issuer: !Ref JwtIssuer

  OperationsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref OperationsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OperationsApiFunction.Arn
      PayloadFormatVersion: '2.0'

  ReadActionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/actions
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadActionEvidenceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/actions/{action_id}/evidence
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadRisksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/risks
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadOutcomesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/outcomes
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadLearningRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/learning
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadPipelineHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/pipeline-health
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadForecastsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/forecasts
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadNetworkRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/network
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  ReadShipmentsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: GET /v1/shipments
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  MutateActionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OperationsApi
      RouteKey: POST /v1/actions/{action_id}/events
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Join ['/', [integrations, !Ref OperationsIntegration]]

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref OperationsApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10}
      AccessLogSettings:
        DestinationArn: !GetAtt OperationsApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":$context.status}'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OperationsApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OperationsApi}/*

  OperationsApiFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Authenticated Operations API service-unavailable responses.
      Namespace: GLAP/OperationsApi
      MetricName: ServiceUnavailable
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OperationsApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Authenticated Operations API Gateway 429 responses.
      Namespace: GLAP/OperationsApi
      MetricName: ThrottleResponses
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint: {Value: !GetAtt OperationsApi.ApiEndpoint}
  ApiFunctionName: {Value: !Ref OperationsApiFunction}
  DeadLetterQueueArn: {Value: !GetAtt OperationsApiDLQ.Arn}
