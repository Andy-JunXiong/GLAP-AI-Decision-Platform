name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Compile Python sources
        run: python -m compileall -q lambda ops examples tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check required SQL artifacts
        shell: bash
        run: |
          test -s sql/00_core_table_ddl.sql
          test -s sql/01_agent_orchestration.sql
          test -s sql/02_validation_queries.sql
          test -s sql/04_stateful_lifecycle_config.sql
          test -s sql/05_stateful_lifecycle_seed.sql
          test -s sql/06_stateful_lifecycle_validation.sql
          test -s sql/07_stateful_lifecycle_compatibility_views.sql

      - name: Validate pipeline reliability template
        shell: bash
        run: |
          test -s infrastructure/pipeline-reliability.yaml
          test -s infrastructure/stateful-lifecycle-staging.yaml
          test -s .github/workflows/deploy-stateful-lifecycle-staging.yml
          test -s ops/deploy_stateful_lifecycle_stack.ps1
          test -s ops/validate_stateful_lifecycle_staging.ps1

      - name: Verify Lambda deployment package entry point
        shell: bash
        run: |
          mkdir -p dist/package
          cp lambda/glap_ai_agent_orchestrator.py dist/package/lambda_function.py
          (cd dist/package && zip -q ../glap-ai-agent-orchestrator.zip lambda_function.py)
          test "$(unzip -Z1 dist/glap-ai-agent-orchestrator.zip)" = "lambda_function.py"

      - name: Verify pipeline controller package entry point
        shell: bash
        run: |
          mkdir -p dist/controller
          cp lambda/glap_pipeline_controller.py dist/controller/lambda_function.py
          cp lambda/glap_quality_contracts.py dist/controller/glap_quality_contracts.py
          (cd dist/controller && zip -q ../glap-pipeline-controller.zip lambda_function.py glap_quality_contracts.py)
          test "$(unzip -Z1 dist/glap-pipeline-controller.zip | sort | tr '\n' ' ')" = "glap_quality_contracts.py lambda_function.py "

      - name: Verify data quality gate package entry point
        shell: bash
        run: |
          mkdir -p dist/quality
          cp lambda/glap_data_quality_gate.py dist/quality/lambda_function.py
          cp lambda/glap_quality_contracts.py dist/quality/glap_quality_contracts.py
          cp sql/06_stateful_lifecycle_validation.sql dist/quality/lifecycle_validation.sql
          (cd dist/quality && zip -q ../glap-data-quality-gate.zip lambda_function.py glap_quality_contracts.py lifecycle_validation.sql)
          test "$(unzip -Z1 dist/glap-data-quality-gate.zip | sort | tr '\n' ' ')" = "glap_quality_contracts.py lambda_function.py lifecycle_validation.sql "

      - name: Verify staging stage stub package entry point
        shell: bash
        run: |
          mkdir -p dist/stub
          cp lambda/glap_pipeline_stage_stub.py dist/stub/lambda_function.py
          (cd dist/stub && zip -q ../glap-pipeline-stage-stub.zip lambda_function.py)
          test "$(unzip -Z1 dist/glap-pipeline-stage-stub.zip)" = "lambda_function.py"

      - name: Verify stateful lifecycle generator package entry point
        shell: bash
        run: |
          mkdir -p dist/lifecycle
          cp lambda/glap_lifecycle_athena_adapter.py dist/lifecycle/lambda_function.py
          cp lambda/glap_stateful_lifecycle_generator.py dist/lifecycle/glap_stateful_lifecycle_generator.py
          (cd dist/lifecycle && zip -q ../glap-stateful-lifecycle-generator.zip lambda_function.py glap_stateful_lifecycle_generator.py)
          test "$(unzip -Z1 dist/glap-stateful-lifecycle-generator.zip | sort | tr '\n' ' ')" = "glap_stateful_lifecycle_generator.py lambda_function.py "
