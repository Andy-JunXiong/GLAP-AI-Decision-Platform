name: Project drift audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-drift-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Generate read-only drift report
        run: >-
          python ops/audit_project_drift.py
          --format markdown
          --output artifacts/project-drift-audit.md

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-drift-audit
          path: artifacts/project-drift-audit.md
          retention-days: 14
          if-no-files-found: error
