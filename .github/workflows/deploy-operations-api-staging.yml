name: Deploy authenticated Operations API staging

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-operations-api-staging.yml"
      - "infrastructure/operations-api-staging.yaml"
      - "lambda/glap_operations_api.py"
      - "ops/deploy_operations_api_stack.ps1"
      - "tests/test_operations_api*.py"
  workflow_dispatch:
    inputs:
      action:
        description: Render the plan or deploy the authenticated staging API
        required: true
        type: choice
        default: plan
        options: [plan, deploy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: operations-api-staging
  cancel-in-progress: false

jobs:
  operations-api-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      ARTIFACT_BUCKET: ${{ vars.AWS_LIFECYCLE_ARTIFACT_BUCKET }}
      DATA_BUCKET: ${{ vars.AWS_LIFECYCLE_DATA_BUCKET }}
      ATHENA_OUTPUT: ${{ vars.AWS_LIFECYCLE_ATHENA_OUTPUT || vars.AWS_OPS_ATHENA_OUTPUT }}
      JWT_ISSUER: ${{ vars.GLAP_OPERATIONS_JWT_ISSUER }}
      JWT_AUDIENCE: ${{ vars.GLAP_OPERATIONS_JWT_AUDIENCE }}
      INTERNAL_ORIGIN: ${{ vars.GLAP_OPERATIONS_INTERNAL_ORIGIN }}
      PIPELINE_STATUS_S3_URI: ${{ vars.GLAP_PIPELINE_STATUS_S3_URI }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test Operations API contracts
        run: |
          python -m unittest discover -s tests -p "test_operations_api*.py" -v

      - name: Validate base staging configuration
        shell: bash
        run: |
          [[ "$ATHENA_OUTPUT" =~ ^s3://[^/]+/.+ ]]
          test -n "$ARTIFACT_BUCKET"
          test -n "$DATA_BUCKET"

      - name: Configure AWS staging credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: glap-operations-api-${{ github.run_id }}

      - name: Resolve protected staging configuration privately
        shell: bash
        run: |
          issuer="$JWT_ISSUER"
          audience="$JWT_AUDIENCE"
          origin="$INTERNAL_ORIGIN"
          pipeline_status_uri="$PIPELINE_STATUS_S3_URI"

          if [[ -z "$issuer" || -z "$audience" || -z "$origin" ]]; then
            if identity_outputs=$(aws cloudformation describe-stacks \
              --stack-name glap-operations-identity-staging --output json 2>/dev/null); then
              stack_issuer=$(jq -r '[.Stacks[0].Outputs[] | select(.OutputKey == "JwtIssuer") | .OutputValue][0] // empty' <<< "$identity_outputs")
              stack_audience=$(jq -r '[.Stacks[0].Outputs[] | select(.OutputKey == "JwtAudience") | .OutputValue][0] // empty' <<< "$identity_outputs")
              stack_origin=$(jq -r '[.Stacks[0].Outputs[] | select(.OutputKey == "InternalOrigin") | .OutputValue][0] // empty' <<< "$identity_outputs")
              [[ -n "$issuer" ]] || issuer="$stack_issuer"
              [[ -n "$audience" ]] || audience="$stack_audience"
              [[ -n "$origin" ]] || origin="$stack_origin"
              echo "Dedicated identity stack configuration available: true"
            else
              echo "Dedicated identity stack configuration available: false"
            fi
          fi

          if [[ -z "$issuer" || -z "$audience" ]]; then
            if ! pool_text=$(aws cognito-idp list-user-pools --max-results 60 \
              --query 'UserPools[].Id' --output text 2>/dev/null); then
              echo "::error::Unable to read Cognito pool candidates with the staging role"
              exit 1
            fi
            mapfile -t pool_ids < <(tr '\t' '\n' <<< "$pool_text" | sed '/^None$/d;/^$/d')
            echo "Cognito pool candidate count: ${#pool_ids[@]}"
            if [[ ${#pool_ids[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one Cognito pool candidate"
              exit 1
            fi
            pool_id="${pool_ids[0]}"
            if ! client_text=$(aws cognito-idp list-user-pool-clients \
              --user-pool-id "$pool_id" --query 'UserPoolClients[].ClientId' \
              --output text 2>/dev/null); then
              echo "::error::Unable to read Cognito app-client candidates with the staging role"
              exit 1
            fi
            mapfile -t client_ids < <(tr '\t' '\n' <<< "$client_text" | sed '/^None$/d;/^$/d')
            echo "Cognito app-client candidate count: ${#client_ids[@]}"
            if [[ ${#client_ids[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one Cognito app-client candidate"
              exit 1
            fi
            [[ -n "$issuer" ]] || issuer="https://cognito-idp.$AWS_REGION.amazonaws.com/$pool_id"
            [[ -n "$audience" ]] || audience="${client_ids[0]}"
          fi

          if [[ -z "$origin" ]]; then
            amplify_text=$(aws amplify list-apps --query 'apps[].defaultDomain' \
              --output text 2>/dev/null || true)
            api_text=$(aws apigatewayv2 get-domain-names --query 'Items[].DomainName' \
              --output text 2>/dev/null || true)
            mapfile -t origins < <(
              printf '%s\n%s\n' "$amplify_text" "$api_text" |
              tr '\t' '\n' | sed '/^None$/d;/^$/d' | sort -u
            )
            echo "Internal HTTPS origin candidate count: ${#origins[@]}"
            if [[ ${#origins[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one internal HTTPS origin candidate"
              exit 1
            fi
            origin="https://${origins[0]}"
          fi

          if [[ -z "$pipeline_status_uri" ]]; then
            reliability_outputs=$(aws cloudformation describe-stacks \
              --stack-name glap-pipeline-reliability-staging --output json)
            pipeline_status_uri=$(jq -r '[.Stacks[0].Outputs[] | select(.OutputKey == "PipelineStatusS3Uri") | .OutputValue][0] // empty' <<< "$reliability_outputs")
          fi

          partition=$(aws sts get-caller-identity --query Arn --output text | cut -d: -f2)
          pipeline_status_object_arn="arn:${partition}:s3:::${pipeline_status_uri#s3://}"

          echo "::add-mask::$issuer"
          echo "::add-mask::$audience"
          echo "::add-mask::$origin"
          echo "::add-mask::$pipeline_status_uri"
          echo "::add-mask::$pipeline_status_object_arn"
          {
            echo "JWT_ISSUER=$issuer"
            echo "JWT_AUDIENCE=$audience"
            echo "INTERNAL_ORIGIN=$origin"
            echo "PIPELINE_STATUS_S3_URI=$pipeline_status_uri"
            echo "PIPELINE_STATUS_OBJECT_ARN=$pipeline_status_object_arn"
          } >> "$GITHUB_ENV"

      - name: Validate protected staging configuration
        shell: bash
        run: |
          [[ "$JWT_ISSUER" =~ ^https://[^[:space:]]+$ ]]
          [[ "$JWT_AUDIENCE" =~ ^[A-Za-z0-9._:/-]{3,255}$ ]]
          [[ "$INTERNAL_ORIGIN" =~ ^https://[^/[:space:]]+$ ]]
          [[ "$PIPELINE_STATUS_S3_URI" =~ ^s3://[^/]+/.+ ]]
          [[ "$PIPELINE_STATUS_OBJECT_ARN" =~ ^arn:[^:]+:s3:::[^/]+/.+ ]]

      - name: Verify private dependencies
        shell: bash
        run: |
          aws sts get-caller-identity >/dev/null
          aws lambda get-function --function-name glap-lifecycle-action-mutation-staging >/dev/null
          aws glue get-table --database-name simulated_iceberg_m --name vw_lifecycle_action_current_staging_v1 >/dev/null
          aws glue get-table --database-name simulated_iceberg_m --name vw_multimodal_forecast_feature_daily_v1 >/dev/null
          aws glue get-table --database-name simulated_iceberg_m --name vw_multimodal_shipment_daily_v1 >/dev/null

      - name: Render deployment plan
        shell: pwsh
        run: |
          ./ops/deploy_operations_api_stack.ps1 `
            -Region $env:AWS_REGION `
            -ArtifactBucket $env:ARTIFACT_BUCKET `
            -JwtIssuer $env:JWT_ISSUER `
            -JwtAudience $env:JWT_AUDIENCE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -AthenaResultsBucketArn "arn:aws:s3:::$env:DATA_BUCKET" `
            -LifecycleDataBucketArn "arn:aws:s3:::$env:DATA_BUCKET" `
            -PipelineStatusS3Uri $env:PIPELINE_STATUS_S3_URI `
            -PipelineStatusObjectArn $env:PIPELINE_STATUS_OBJECT_ARN `
            -AllowedOrigin $env:INTERNAL_ORIGIN

      - name: Deploy authenticated staging API
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
        shell: pwsh
        run: |
          ./ops/deploy_operations_api_stack.ps1 `
            -Region $env:AWS_REGION `
            -ArtifactBucket $env:ARTIFACT_BUCKET `
            -ApiArtifactKey "stateful-lifecycle-staging/artifacts/operations-api-${{ github.sha }}.zip" `
            -JwtIssuer $env:JWT_ISSUER `
            -JwtAudience $env:JWT_AUDIENCE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -AthenaResultsBucketArn "arn:aws:s3:::$env:DATA_BUCKET" `
            -LifecycleDataBucketArn "arn:aws:s3:::$env:DATA_BUCKET" `
            -PipelineStatusS3Uri $env:PIPELINE_STATUS_S3_URI `
            -PipelineStatusObjectArn $env:PIPELINE_STATUS_OBJECT_ARN `
            -AllowedOrigin $env:INTERNAL_ORIGIN `
            -Apply

      - name: Record governed boundary
        if: success()
        shell: bash
        run: |
          {
            echo "## Authenticated Operations API staging"
            echo "- Requested action: \`${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }}\`"
            echo "- JWT configuration source: protected staging variables"
            echo "- Public Pages write access: \`false\`"
            echo "- Private Pipeline Health source configured: \`true\`"
            echo "- Schedule created: \`false\`"
            echo "- Production alias changed: \`false\`"
            echo "- Runtime role tests completed: \`false\` (separate named identities required)"
          } >> "$GITHUB_STEP_SUMMARY"
