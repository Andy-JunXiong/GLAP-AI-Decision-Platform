name: Backtest multimodal forecast staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: Render a plan or run the private read-only backtest
        required: true
        type: choice
        default: plan
        options:
          - plan
          - backtest
      execution_mode:
        description: Real calendar boundary or explicitly isolated future simulation
        required: true
        type: choice
        default: OPERATIONAL
        options:
          - OPERATIONAL
          - FUTURE_SIMULATION
      scenario_id:
        description: Required safe identifier only for FUTURE_SIMULATION
        required: false
        type: string
        default: ""
      start_date:
        description: First closed feature date (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-08-04"
      end_date:
        description: Last closed feature date (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-08-06"
      minimum_history:
        description: Minimum earlier rows required per mode/provider
        required: true
        type: number
        default: 14

permissions:
  contents: read
  id-token: write

concurrency:
  group: multimodal-forecast-staging
  cancel-in-progress: false

jobs:
  forecast-backtest:
    name: Private forecast backtest
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      SOURCE_DATABASE: simulated_iceberg_m
      ATHENA_WORKGROUP: primary
      ATHENA_OUTPUT: ${{ vars.AWS_LIFECYCLE_ATHENA_OUTPUT || vars.AWS_OPS_ATHENA_OUTPUT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test forecast contract and backtest
        run: |
          python -m compileall -q ops tests
          python -m unittest discover -s tests -p "test_multimodal_forecast_backtest.py" -v
          python -m unittest discover -s tests -p "test_multimodal_label_readiness.py" -v

      - name: Validate inputs
        shell: bash
        run: |
          [[ "${{ inputs.start_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${{ inputs.end_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          sydney_today=$(TZ=Australia/Sydney date +%F)
          if [[ "${{ inputs.execution_mode }}" == "OPERATIONAL" ]]; then
            test -z "${{ inputs.scenario_id }}"
            [[ "${{ inputs.end_date }}" < "$sydney_today" || "${{ inputs.end_date }}" == "$sydney_today" ]]
          else
            [[ "${{ inputs.scenario_id }}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$ ]]
          fi
          test "${{ inputs.minimum_history }}" -ge 2
          test "${{ inputs.minimum_history }}" -le 90
          [[ "$ATHENA_OUTPUT" =~ ^s3://[^/]+/.+ ]]

      - name: Render read-only backtest plan
        shell: pwsh
        run: |
          ./ops/run_multimodal_forecast_backtest.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.start_date }}" `
            -EndDate "${{ inputs.end_date }}" `
            -MinimumHistory ${{ inputs.minimum_history }} `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}"
          ./ops/run_multimodal_label_readiness.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -CohortStartDate "${{ inputs.start_date }}" `
            -CutoffDate "${{ inputs.end_date }}" `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}"

      - name: Configure AWS staging credentials
        if: inputs.action == 'backtest'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: glap-forecast-${{ github.run_id }}

      - name: Run private read-only backtest
        if: inputs.action == 'backtest'
        shell: pwsh
        run: |
          ./ops/run_multimodal_forecast_backtest.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.start_date }}" `
            -EndDate "${{ inputs.end_date }}" `
            -MinimumHistory ${{ inputs.minimum_history }} `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -Apply

      - name: Assess supervised-label readiness
        if: inputs.action == 'backtest'
        shell: pwsh
        run: |
          ./ops/run_multimodal_label_readiness.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -CohortStartDate "${{ inputs.start_date }}" `
            -CutoffDate "${{ inputs.end_date }}" `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -Apply

      - name: Upload private backtest evidence
        if: inputs.action == 'backtest' && success()
        uses: actions/upload-artifact@v6
        with:
          name: multimodal-forecast-backtest-${{ github.run_id }}
          path: artifacts/forecast-backtest/
          retention-days: 14
          if-no-files-found: error

      - name: Write validation boundary
        if: success()
        shell: bash
        run: |
          {
            echo "## Multimodal forecast staging"
            echo "- Requested action: \`${{ inputs.action }}\`"
            echo "- Execution mode: \`${{ inputs.execution_mode }}\`"
            echo "- Scenario ID: \`${{ inputs.scenario_id }}\`"
            echo "- Feature window: \`${{ inputs.start_date }}\` through \`${{ inputs.end_date }}\`"
            echo "- Evaluation: rolling one-step-ahead, mode/provider separated"
            echo "- Pending outcome labels used for training: \`false\`"
            echo "- Public Pages publication: \`false\`"
            echo "- Production writes: \`false\`"
            echo "- Schedule created: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
