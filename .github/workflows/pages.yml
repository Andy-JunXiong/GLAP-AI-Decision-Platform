name: Deploy product demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "offline/glap-demo.html"
      - "offline/data/ops-snapshot.json"
      - "ops/export_ops_snapshot.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish interactive demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Configure read-only AWS OPS credentials
        if: ${{ vars.AWS_OPS_READ_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OPS_READ_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: glap-public-ops-${{ github.run_id }}

      - name: Export sanitized AWS OPS snapshot
        if: ${{ vars.AWS_OPS_READ_ROLE_ARN != '' }}
        env:
          AWS_REGION: us-east-1
          ATHENA_DATABASE: ${{ vars.AWS_OPS_DATABASE }}
          ATHENA_OUTPUT: ${{ vars.AWS_OPS_ATHENA_OUTPUT }}
          ATHENA_WORKGROUP: ${{ vars.AWS_OPS_WORKGROUP }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check boto3
          python ops/export_ops_snapshot.py --output offline/data/ops-snapshot.json

      - name: Record fallback data mode
        if: ${{ vars.AWS_OPS_READ_ROLE_ARN == '' }}
        shell: bash
        run: |
          echo "AWS_OPS_READ_ROLE_ARN is not configured; publishing the explicit non-live fallback snapshot." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp offline/glap-demo.html _site/index.html
          cp -R offline/data _site/data
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
