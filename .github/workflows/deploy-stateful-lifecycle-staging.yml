name: Deploy stateful lifecycle staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan, replay, integration, or read-only analytics contract deployment
        required: true
        type: choice
        default: plan
        options:
          - plan
          - deploy-replay-validate
          - deploy-integration-validate
          - deploy-analytics-contract
          - extend-integration-validate
      load_initial_seed:
        description: Load Q3 seed once; leave false on repeat deployments
        required: true
        type: boolean
        default: false
      replay_start_date:
        description: First logical date (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-08-04"
      replay_days:
        description: Number of logical dates
        required: true
        type: number
        default: 28
      population_size:
        description: Initial active shipment population
        required: true
        type: number
        default: 450
      integration_logical_date:
        description: One isolated date after the replay range (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-09-02"

permissions:
  contents: read
  id-token: write

concurrency:
  group: stateful-lifecycle-staging
  cancel-in-progress: false

jobs:
  lifecycle-staging:
    name: Stateful lifecycle staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    env:
      AWS_REGION: us-east-1
      SOURCE_DATABASE: simulated_iceberg_m
      ATHENA_WORKGROUP: primary
      STACK_NAME: glap-stateful-lifecycle-staging
      FUNCTION_NAME: glap-stateful-lifecycle-generator-staging
      CONTROLLER_FUNCTION: glap-stateful-lifecycle-controller-staging
      ARTIFACT_PREFIX: stateful-lifecycle-staging/artifacts
      LIFECYCLE_DATA_PREFIX: stateful-lifecycle-staging/data
      ARTIFACT_BUCKET: ${{ vars.AWS_LIFECYCLE_ARTIFACT_BUCKET }}
      DATA_BUCKET: ${{ vars.AWS_LIFECYCLE_DATA_BUCKET }}
      ATHENA_OUTPUT: ${{ vars.AWS_LIFECYCLE_ATHENA_OUTPUT || vars.AWS_OPS_ATHENA_OUTPUT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test lifecycle implementation
        run: |
          python -m compileall -q lambda tests
          python -m unittest discover -s tests -p "test_stateful_lifecycle_generator.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_athena_adapter.py" -v
          python -m unittest discover -s tests -p "test_pipeline_controller.py" -v
          python -m unittest discover -s tests -p "test_data_quality_gate.py" -v
          python -m unittest discover -s tests -p "test_stateful_lifecycle_deployment.py" -v

      - name: Verify required private environment variables
        shell: bash
        run: |
          test -n "$ARTIFACT_BUCKET"
          test -n "$DATA_BUCKET"
          [[ "$ATHENA_OUTPUT" =~ ^s3://[^/]+/.+ ]]
          [[ "${{ inputs.replay_start_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${{ inputs.integration_logical_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "${{ inputs.replay_days }}" -ge 1
          test "${{ inputs.replay_days }}" -le 90
          test "${{ inputs.population_size }}" -ge 1
          test "${{ inputs.population_size }}" -le 5000

      - name: Configure AWS staging credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: glap-lifecycle-${{ github.run_id }}

      - name: Verify isolated AWS targets
        shell: bash
        run: |
          aws sts get-caller-identity >/dev/null
          engine=$(aws athena get-work-group \
            --work-group "$ATHENA_WORKGROUP" \
            --query 'WorkGroup.Configuration.EngineVersion.EffectiveEngineVersion' \
            --output text)
          test "$engine" = "Athena engine version 3"
          aws s3api get-bucket-location --bucket "$ARTIFACT_BUCKET" >/dev/null
          aws s3api get-bucket-location --bucket "$DATA_BUCKET" >/dev/null

      - name: Render deployment plans
        shell: pwsh
        run: |
          $schemaPlan = @{
            Region = $env:AWS_REGION
            SourceDatabase = $env:SOURCE_DATABASE
            SourceBucketUri = "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX"
            AthenaOutputUri = $env:ATHENA_OUTPUT
            Workgroup = $env:ATHENA_WORKGROUP
          }
          if ("${{ inputs.action }}" -eq "deploy-analytics-contract") {
            $schemaPlan.AnalyticsOnly = $true
          }
          ./ops/deploy_stateful_lifecycle.ps1 @schemaPlan
          ./ops/deploy_stateful_lifecycle_stack.ps1 `
            -Region $env:AWS_REGION `
            -StackName $env:STACK_NAME `
            -FunctionName $env:FUNCTION_NAME `
            -SourceDatabase $env:SOURCE_DATABASE `
            -Workgroup $env:ATHENA_WORKGROUP `
            -ArtifactBucket $env:ARTIFACT_BUCKET `
            -LifecycleDataBucket $env:DATA_BUCKET `
            -LifecycleDataPrefix $env:LIFECYCLE_DATA_PREFIX `
            -AthenaOutputUri $env:ATHENA_OUTPUT
          ./ops/replay_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -FunctionName $env:FUNCTION_NAME `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -PopulationSize ${{ inputs.population_size }}
          ./ops/extend_stateful_lifecycle_controller_staging.ps1 `
            -Region $env:AWS_REGION `
            -ControllerFunction $env:CONTROLLER_FUNCTION `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }}
          ./ops/validate_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }}

      - name: Create lifecycle schema and optional first seed
        if: inputs.action == 'deploy-replay-validate' || inputs.action == 'deploy-integration-validate'
        shell: pwsh
        run: |
          $parameters = @{
            Region = $env:AWS_REGION
            SourceDatabase = $env:SOURCE_DATABASE
            SourceBucketUri = "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX"
            AthenaOutputUri = $env:ATHENA_OUTPUT
            Workgroup = $env:ATHENA_WORKGROUP
            Apply = $true
          }
          if ("${{ inputs.load_initial_seed }}" -eq "true" -and
              "${{ inputs.action }}" -eq "deploy-replay-validate") {
            $parameters.IncludeSeed = $true
          }
          ./ops/deploy_stateful_lifecycle.ps1 @parameters

      - name: Deploy unscheduled lifecycle and integration stack
        if: inputs.action == 'deploy-replay-validate' || inputs.action == 'deploy-integration-validate'
        shell: pwsh
        run: |
          ./ops/deploy_stateful_lifecycle_stack.ps1 `
            -Region $env:AWS_REGION `
            -StackName $env:STACK_NAME `
            -FunctionName $env:FUNCTION_NAME `
            -SourceDatabase $env:SOURCE_DATABASE `
            -Workgroup $env:ATHENA_WORKGROUP `
            -ArtifactBucket $env:ARTIFACT_BUCKET `
            -LifecycleDataBucket $env:DATA_BUCKET `
            -LifecycleDataPrefix $env:LIFECYCLE_DATA_PREFIX `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -ArtifactKey "$env:ARTIFACT_PREFIX/generator-${{ github.sha }}.zip" `
            -ControllerArtifactKey "$env:ARTIFACT_PREFIX/controller-${{ github.sha }}.zip" `
            -QualityGateArtifactKey "$env:ARTIFACT_PREFIX/quality-${{ github.sha }}.zip" `
            -Apply

      - name: Deploy read-only analytics contract
        if: inputs.action == 'deploy-analytics-contract'
        shell: pwsh
        run: |
          ./ops/deploy_stateful_lifecycle.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -SourceBucketUri "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX" `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -AnalyticsOnly `
            -Apply

      - name: Validate deployed analytics contract
        if: inputs.action == 'deploy-analytics-contract'
        shell: pwsh
        run: |
          ./ops/validate_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.integration_logical_date }}" `
            -Days 1 `
            -Apply

      - name: Replay 28 logical dates
        if: inputs.action == 'deploy-replay-validate'
        shell: pwsh
        run: |
          ./ops/replay_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -FunctionName $env:FUNCTION_NAME `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -PopulationSize ${{ inputs.population_size }} `
            -Apply

      - name: Reconcile every logical date
        if: inputs.action == 'deploy-replay-validate'
        shell: pwsh
        run: |
          ./ops/validate_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -Apply

      - name: Validate lifecycle pipeline integration
        if: inputs.action == 'deploy-integration-validate'
        shell: bash
        run: |
          metadata=$(aws lambda invoke \
            --function-name "$CONTROLLER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60 \
            --payload '{"logical_run_date":"${{ inputs.integration_logical_date }}"}' \
            integration-response.json)
          test "$(python -c 'import json,sys; print(json.load(sys.stdin).get("FunctionError", ""))' <<< "$metadata")" = ""
          python -c 'import json; data=json.load(open("integration-response.json")); stages=data["stages"]; assert data["status"] == "succeeded", data; assert [s["name"] for s in stages] == ["stateful_lifecycle_generation", "lifecycle_validation", "input_validation", "analytics_validation"], stages; assert len(stages[1]["quality_checks"]) == 19 and len(stages[2]["quality_checks"]) == 5 and len(stages[3]["quality_checks"]) == 8, stages; assert all(c["status"] == "passed" for s in stages[1:] for c in s["quality_checks"]), stages'

      - name: Extend lifecycle through governed controller
        if: inputs.action == 'extend-integration-validate'
        shell: pwsh
        run: |
          ./ops/extend_stateful_lifecycle_controller_staging.ps1 `
            -Region $env:AWS_REGION `
            -ControllerFunction $env:CONTROLLER_FUNCTION `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -Apply

      - name: Write staging evidence summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Stateful lifecycle staging"
            echo "- Requested action: \`${{ inputs.action }}\`"
            echo "- Logical dates: \`${{ inputs.replay_start_date }}\` + ${{ inputs.replay_days }} days"
            echo "- Initial population: \`${{ inputs.population_size }}\`"
            echo "- Integration logical date: \`${{ inputs.integration_logical_date }}\`"
            echo "- Lifecycle integration controller: isolated and manual"
            echo "- Production alias changed: \`false\`"
            echo "- Schedule created: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
