name: Deploy stateful lifecycle staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan, configure, deploy, replay, extend, or recover isolated staging
        required: true
        type: choice
        default: plan
        options:
          - plan
          - deploy-replay-validate
          - deploy-integration-validate
          - deploy-analytics-contract
          - deploy-operational-baseline
          - deploy-q4-configuration
          - extend-integration-validate
          - deploy-recovery-controller
          - recover-failed-integration-date
          - diagnose-integration-date
      execution_mode:
        description: Real calendar boundary or explicitly isolated future simulation
        required: true
        type: choice
        default: OPERATIONAL
        options:
          - OPERATIONAL
          - FUTURE_SIMULATION
      scenario_id:
        description: Required safe identifier only for FUTURE_SIMULATION
        required: false
        type: string
        default: ""
      load_initial_seed:
        description: Load Q3 seed once; leave false on repeat deployments
        required: true
        type: boolean
        default: false
      replay_start_date:
        description: First logical date (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-08-04"
      replay_days:
        description: Number of logical dates
        required: true
        type: number
        default: 3
      population_size:
        description: Initial active shipment population
        required: true
        type: number
        default: 450
      integration_logical_date:
        description: One isolated date after the replay range (YYYY-MM-DD)
        required: true
        type: string
        default: "2026-08-06"

permissions:
  contents: read
  id-token: write

concurrency:
  group: stateful-lifecycle-staging
  cancel-in-progress: false

jobs:
  lifecycle-staging:
    name: Stateful lifecycle staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    env:
      AWS_REGION: us-east-1
      SOURCE_DATABASE: simulated_iceberg_m
      ATHENA_WORKGROUP: primary
      STACK_NAME: glap-stateful-lifecycle-staging
      FUNCTION_NAME: glap-stateful-lifecycle-generator-staging
      CONTROLLER_FUNCTION: glap-stateful-lifecycle-controller-staging
      QUALITY_GATE_FUNCTION: glap-stateful-lifecycle-quality-gate-staging
      ARTIFACT_PREFIX: stateful-lifecycle-staging/artifacts
      LIFECYCLE_DATA_PREFIX: stateful-lifecycle-staging/data
      ARTIFACT_BUCKET: ${{ vars.AWS_LIFECYCLE_ARTIFACT_BUCKET }}
      DATA_BUCKET: ${{ vars.AWS_LIFECYCLE_DATA_BUCKET }}
      ATHENA_OUTPUT: ${{ vars.AWS_LIFECYCLE_ATHENA_OUTPUT || vars.AWS_OPS_ATHENA_OUTPUT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test lifecycle implementation
        run: |
          python -m compileall -q lambda tests
          python -m unittest discover -s tests -p "test_stateful_lifecycle_generator.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_athena_adapter.py" -v
          python -m unittest discover -s tests -p "test_pipeline_controller.py" -v
          python -m unittest discover -s tests -p "test_data_quality_gate.py" -v
          python -m unittest discover -s tests -p "test_stateful_lifecycle_deployment.py" -v

      - name: Verify required private environment variables
        shell: bash
        run: |
          test -n "$ARTIFACT_BUCKET"
          test -n "$DATA_BUCKET"
          [[ "$ATHENA_OUTPUT" =~ ^s3://[^/]+/.+ ]]
          [[ "${{ inputs.replay_start_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${{ inputs.integration_logical_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          replay_last=$(date -u -d "${{ inputs.replay_start_date }} + $(( ${{ inputs.replay_days }} - 1 )) days" +%F)
          sydney_today=$(TZ=Australia/Sydney date +%F)
          if [[ "${{ inputs.execution_mode }}" == "OPERATIONAL" ]]; then
            test -z "${{ inputs.scenario_id }}"
            [[ "$replay_last" < "$sydney_today" || "$replay_last" == "$sydney_today" ]]
            [[ "${{ inputs.integration_logical_date }}" < "$sydney_today" || "${{ inputs.integration_logical_date }}" == "$sydney_today" ]]
          else
            [[ "${{ inputs.scenario_id }}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$ ]]
          fi
          test "${{ inputs.replay_days }}" -ge 1
          test "${{ inputs.replay_days }}" -le 90
          if [[ "${{ inputs.action }}" == "extend-integration-validate" ]]; then
            test "${{ inputs.replay_days }}" -le 12
          fi
          if [[ "${{ inputs.action }}" == "recover-failed-integration-date" ]]; then
            test "${{ inputs.replay_days }}" -eq 1
          fi
          if [[ "${{ inputs.action }}" == "diagnose-integration-date" ]]; then
            test "${{ inputs.replay_days }}" -eq 1
          fi
          if [[ "${{ inputs.action }}" == "deploy-operational-baseline" ]]; then
            test "${{ inputs.execution_mode }}" = "OPERATIONAL"
            test -z "${{ inputs.scenario_id }}"
          fi
          test "${{ inputs.population_size }}" -ge 1
          test "${{ inputs.population_size }}" -le 5000

      - name: Configure AWS staging credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: glap-lifecycle-${{ github.run_id }}

      - name: Verify isolated AWS targets
        shell: bash
        run: |
          aws sts get-caller-identity >/dev/null
          engine=$(aws athena get-work-group \
            --work-group "$ATHENA_WORKGROUP" \
            --query 'WorkGroup.Configuration.EngineVersion.EffectiveEngineVersion' \
            --output text)
          test "$engine" = "Athena engine version 3"
          aws s3api get-bucket-location --bucket "$ARTIFACT_BUCKET" >/dev/null
          aws s3api get-bucket-location --bucket "$DATA_BUCKET" >/dev/null

      - name: Render deployment plans
        shell: pwsh
        run: |
          $schemaPlan = @{
            Region = $env:AWS_REGION
            SourceDatabase = $env:SOURCE_DATABASE
            SourceBucketUri = "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX"
            AthenaOutputUri = $env:ATHENA_OUTPUT
            Workgroup = $env:ATHENA_WORKGROUP
          }
          if ("${{ inputs.action }}" -eq "deploy-q4-configuration") {
            $schemaPlan.Q4ConfigurationOnly = $true
          } elseif ("${{ inputs.action }}" -eq "deploy-analytics-contract") {
            $schemaPlan.AnalyticsOnly = $true
          }
          ./ops/deploy_stateful_lifecycle.ps1 @schemaPlan
          ./ops/deploy_stateful_lifecycle_stack.ps1 `
            -Region $env:AWS_REGION `
            -StackName $env:STACK_NAME `
            -FunctionName $env:FUNCTION_NAME `
            -SourceDatabase $env:SOURCE_DATABASE `
            -Workgroup $env:ATHENA_WORKGROUP `
            -ArtifactBucket $env:ARTIFACT_BUCKET `
            -LifecycleDataBucket $env:DATA_BUCKET `
            -LifecycleDataPrefix $env:LIFECYCLE_DATA_PREFIX `
            -AthenaOutputUri $env:ATHENA_OUTPUT
          ./ops/replay_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -FunctionName $env:FUNCTION_NAME `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -PopulationSize ${{ inputs.population_size }} `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}"
          $action = "${{ inputs.action }}"
          if ($action -in @("plan", "deploy-operational-baseline")) {
            ./ops/deploy_operational_baseline.ps1 `
              -Region $env:AWS_REGION `
              -SourceDatabase $env:SOURCE_DATABASE `
              -AthenaOutputUri $env:ATHENA_OUTPUT `
              -Workgroup $env:ATHENA_WORKGROUP `
              -AsOfDate "${{ inputs.integration_logical_date }}"
          }
          if ($action -in @("plan", "extend-integration-validate", "recover-failed-integration-date")) {
            $extensionPlan = @{
              Region = $env:AWS_REGION
              ControllerFunction = $env:CONTROLLER_FUNCTION
              StartDate = "${{ inputs.replay_start_date }}"
              Days = [Math]::Min([int]"${{ inputs.replay_days }}", 12)
              MaxElapsedMinutes = 50
              ExecutionMode = "${{ inputs.execution_mode }}"
              ScenarioId = "${{ inputs.scenario_id }}"
            }
            if ($action -eq "recover-failed-integration-date") {
              $extensionPlan.RetryFailedRun = $true
            }
            ./ops/extend_stateful_lifecycle_controller_staging.ps1 @extensionPlan
          }
          ./ops/validate_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}"

      - name: Create lifecycle schema and optional first seed
        if: inputs.action == 'deploy-replay-validate' || inputs.action == 'deploy-integration-validate' || inputs.action == 'deploy-recovery-controller'
        shell: pwsh
        run: |
          $parameters = @{
            Region = $env:AWS_REGION
            SourceDatabase = $env:SOURCE_DATABASE
            SourceBucketUri = "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX"
            AthenaOutputUri = $env:ATHENA_OUTPUT
            Workgroup = $env:ATHENA_WORKGROUP
            Apply = $true
          }
          if ("${{ inputs.load_initial_seed }}" -eq "true" -and
              "${{ inputs.action }}" -eq "deploy-replay-validate") {
            $parameters.IncludeSeed = $true
          }
          ./ops/deploy_stateful_lifecycle.ps1 @parameters

      - name: Backfill and verify row-level temporal isolation
        if: inputs.action == 'deploy-recovery-controller'
        shell: pwsh
        run: |
          ./ops/backfill_temporal_scope.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -AsOfDate "2026-08-06" `
            -LegacyScenarioId "legacy-pre-boundary-2026" `
            -Apply

      - name: Deploy Q4 simulated rate configuration
        if: inputs.action == 'deploy-q4-configuration'
        shell: pwsh
        run: |
          ./ops/deploy_stateful_lifecycle.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -SourceBucketUri "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX" `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -Q4ConfigurationOnly `
            -Apply

      - name: Deploy and validate operational as-of baseline
        if: inputs.action == 'deploy-operational-baseline'
        shell: pwsh
        run: |
          ./ops/deploy_operational_baseline.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -AsOfDate "${{ inputs.integration_logical_date }}" `
            -Apply

      - name: Deploy unscheduled lifecycle and integration stack
        if: inputs.action == 'deploy-replay-validate' || inputs.action == 'deploy-integration-validate' || inputs.action == 'deploy-recovery-controller'
        shell: pwsh
        run: |
          ./ops/deploy_stateful_lifecycle_stack.ps1 `
            -Region $env:AWS_REGION `
            -StackName $env:STACK_NAME `
            -FunctionName $env:FUNCTION_NAME `
            -SourceDatabase $env:SOURCE_DATABASE `
            -Workgroup $env:ATHENA_WORKGROUP `
            -ArtifactBucket $env:ARTIFACT_BUCKET `
            -LifecycleDataBucket $env:DATA_BUCKET `
            -LifecycleDataPrefix $env:LIFECYCLE_DATA_PREFIX `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -ArtifactKey "$env:ARTIFACT_PREFIX/generator-${{ github.sha }}.zip" `
            -ControllerArtifactKey "$env:ARTIFACT_PREFIX/controller-${{ github.sha }}.zip" `
            -QualityGateArtifactKey "$env:ARTIFACT_PREFIX/quality-${{ github.sha }}.zip" `
            -ActionMutationArtifactKey "$env:ARTIFACT_PREFIX/action-mutation-${{ github.sha }}.zip" `
            -Apply

      - name: Deploy read-only analytics contract
        if: inputs.action == 'deploy-analytics-contract'
        shell: pwsh
        run: |
          ./ops/deploy_stateful_lifecycle.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -SourceBucketUri "s3://$env:DATA_BUCKET/$env:LIFECYCLE_DATA_PREFIX" `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -AnalyticsOnly `
            -Apply

      - name: Verify deployed temporal truthfulness guard
        if: inputs.action == 'deploy-recovery-controller'
        shell: bash
        run: |
          tomorrow=$(TZ=Australia/Sydney date -d tomorrow +%F)
          operational_metadata=$(aws lambda invoke \
            --function-name "$CONTROLLER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"logical_run_date\":\"$tomorrow\",\"execution_mode\":\"OPERATIONAL\",\"dry_run\":true}" \
            operational-boundary-response.json)
          test "$(python -c 'import json,sys; print(json.load(sys.stdin).get("FunctionError", ""))' <<< "$operational_metadata")" = "Unhandled"
          python -c 'import json; data=json.load(open("operational-boundary-response.json")); assert "exceeds Sydney as_of_date" in data["errorMessage"], data'

          simulation_metadata=$(aws lambda invoke \
            --function-name "$CONTROLLER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"logical_run_date\":\"$tomorrow\",\"execution_mode\":\"FUTURE_SIMULATION\",\"scenario_id\":\"temporal-boundary-smoke\",\"dry_run\":true}" \
            simulation-boundary-response.json)
          test "$(python -c 'import json,sys; print(json.load(sys.stdin).get("FunctionError", ""))' <<< "$simulation_metadata")" = ""
          python -c 'import json; data=json.load(open("simulation-boundary-response.json")); assert data["status"] == "succeeded" and data["dry_run"] is True, data; assert data["execution_mode"] == "FUTURE_SIMULATION" and data["time_basis"] == "FUTURE_SIMULATION", data; assert data["scenario_id"] == "temporal-boundary-smoke", data; assert all(stage["status"] == "not_invoked" for stage in data["stages"]), data'

      - name: Validate deployed analytics contract
        if: inputs.action == 'deploy-analytics-contract'
        shell: pwsh
        run: |
          ./ops/validate_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.integration_logical_date }}" `
            -Days 1 `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -Apply

      - name: Replay 28 logical dates
        if: inputs.action == 'deploy-replay-validate'
        shell: pwsh
        run: |
          ./ops/replay_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -FunctionName $env:FUNCTION_NAME `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -PopulationSize ${{ inputs.population_size }} `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -Apply

      - name: Reconcile every logical date
        if: inputs.action == 'deploy-replay-validate'
        shell: pwsh
        run: |
          ./ops/validate_stateful_lifecycle_staging.ps1 `
            -Region $env:AWS_REGION `
            -SourceDatabase $env:SOURCE_DATABASE `
            -AthenaOutputUri $env:ATHENA_OUTPUT `
            -Workgroup $env:ATHENA_WORKGROUP `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -Apply

      - name: Validate lifecycle pipeline integration
        if: inputs.action == 'deploy-integration-validate'
        shell: bash
        run: |
          metadata=$(aws lambda invoke \
            --function-name "$CONTROLLER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60 \
            --payload '{"logical_run_date":"${{ inputs.integration_logical_date }}","execution_mode":"${{ inputs.execution_mode }}","scenario_id":"${{ inputs.scenario_id }}"}' \
            integration-response.json)
          test "$(python -c 'import json,sys; print(json.load(sys.stdin).get("FunctionError", ""))' <<< "$metadata")" = ""
          python -c 'import json; data=json.load(open("integration-response.json")); stages=data["stages"]; assert data["status"] == "succeeded", data; assert [s["name"] for s in stages] == ["stateful_lifecycle_generation", "lifecycle_validation", "input_validation", "analytics_validation"], stages; assert len(stages[1]["quality_checks"]) == 20 and len(stages[2]["quality_checks"]) == 5 and len(stages[3]["quality_checks"]) == 8, stages; assert all(c["status"] == "passed" for s in stages[1:] for c in s["quality_checks"]), stages'

      - name: Extend lifecycle through governed controller
        if: inputs.action == 'extend-integration-validate'
        shell: pwsh
        run: |
          ./ops/extend_stateful_lifecycle_controller_staging.ps1 `
            -Region $env:AWS_REGION `
            -ControllerFunction $env:CONTROLLER_FUNCTION `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days ${{ inputs.replay_days }} `
            -MaxElapsedMinutes 50 `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -Apply

      - name: Diagnose one lifecycle date without mutation
        if: inputs.action == 'diagnose-integration-date'
        shell: pwsh
        run: |
          $payload = @{
            logical_run_date = "${{ inputs.replay_start_date }}"
            pipeline_stage = "lifecycle_validation"
            quality_contract = "lifecycle_v1"
            execution_mode = "${{ inputs.execution_mode }}"
            scenario_id = "${{ inputs.scenario_id }}"
          } | ConvertTo-Json -Compress
          $payloadPath = [IO.Path]::GetTempFileName()
          $responsePath = [IO.Path]::GetTempFileName()
          try {
            [IO.File]::WriteAllText(
              $payloadPath, $payload, [Text.UTF8Encoding]::new($false)
            )
            $metadataJson = & aws lambda invoke `
              --function-name $env:QUALITY_GATE_FUNCTION `
              --payload "fileb://$payloadPath" `
              --cli-read-timeout 300 `
              --cli-connect-timeout 60 `
              --region $env:AWS_REGION `
              $responsePath `
              --output json
            if ($LASTEXITCODE -ne 0 -or -not $metadataJson) {
              throw "Unable to invoke the deployed lifecycle quality gate"
            }
            $metadata = $metadataJson | ConvertFrom-Json
            if ($metadata.FunctionError) {
              throw "The deployed lifecycle quality gate returned a FunctionError"
            }
            $response = Get-Content -LiteralPath $responsePath -Raw | ConvertFrom-Json
            if ($response.status -ne "success" -or
                $response.pipeline_stage -ne "lifecycle_validation") {
              throw "The deployed lifecycle quality gate returned an invalid contract"
            }
            $checks = @($response.quality_checks.psobject.Properties)
            if ($checks.Count -lt 1 -or
                @($checks | Where-Object {
                  $_.Name -notmatch '^[a-z][a-z0-9_]{1,63}$' -or
                  $_.Value -notin @("passed", "failed")
                }).Count -ne 0) {
              throw "The deployed lifecycle quality gate returned unsafe checks"
            }
            $failedChecks = @(
              $checks | Where-Object { $_.Value -eq "failed" } |
                ForEach-Object { $_.Name } | Sort-Object
            )
            Write-Host (
              "Deployed lifecycle quality gate: $($checks.Count) checks, " +
              "$($failedChecks.Count) failed"
            )

            $scopeId = if ("${{ inputs.execution_mode }}" -eq "OPERATIONAL") {
              "OPERATIONAL"
            } else {
              "SIMULATION:${{ inputs.scenario_id }}"
            }
            $logicalDate = "${{ inputs.replay_start_date }}"
            $outcomeQuery = @(
              "WITH ranked_outcomes AS ("
              "SELECT outcome_id, status, observation_due_date,"
              "row_number() OVER (PARTITION BY outcome_id"
              "ORDER BY try_cast(dt AS date) DESC, as_of_date DESC) AS row_rank"
              "FROM $env:SOURCE_DATABASE.fact_lifecycle_outcome_staging_v1"
              "WHERE temporal_scope_id = '$scopeId'"
              "AND try_cast(dt AS date) <= DATE '$logicalDate')"
              "SELECT status, count(*) AS outcome_count FROM ranked_outcomes"
              "WHERE row_rank = 1"
              "AND observation_due_date <= DATE '$logicalDate'"
              "GROUP BY status ORDER BY status"
            ) -join "`n"
            $queryId = & aws athena start-query-execution `
              --query-string $outcomeQuery `
              --query-execution-context "Database=$env:SOURCE_DATABASE" `
              --result-configuration "OutputLocation=$env:ATHENA_OUTPUT" `
              --work-group $env:ATHENA_WORKGROUP `
              --region $env:AWS_REGION `
              --query QueryExecutionId `
              --output text
            if ($LASTEXITCODE -ne 0 -or -not $queryId) {
              throw "Unable to start the due-outcome aggregate query"
            }
            do {
              Start-Sleep -Seconds 1
              $queryExecution = & aws athena get-query-execution `
                --query-execution-id $queryId `
                --region $env:AWS_REGION `
                --output json | ConvertFrom-Json
              $queryState = $queryExecution.QueryExecution.Status.State
            } while ($queryState -in @("QUEUED", "RUNNING"))
            if ($queryState -ne "SUCCEEDED") {
              throw "The due-outcome aggregate query did not succeed"
            }
            $queryResult = & aws athena get-query-results `
              --query-execution-id $queryId `
              --max-results 20 `
              --region $env:AWS_REGION `
              --output json | ConvertFrom-Json
            $outcomeStates = @("PENDING", "SUCCESSFUL", "PARTIALLY_SUCCESSFUL", "FAILED", "INCONCLUSIVE")
            $outcomeSummary = @()
            foreach ($row in @($queryResult.ResultSet.Rows | Select-Object -Skip 1)) {
              $status = [string]$row.Data[0].VarCharValue
              $count = [int64]$row.Data[1].VarCharValue
              if ($status -notin $outcomeStates -or $count -lt 0) {
                throw "The due-outcome aggregate query returned an unsafe result"
              }
              $outcomeSummary += "$status=$count"
            }
            if ($outcomeSummary.Count -eq 0) {
              $outcomeSummary = @("NONE=0")
            }
            Write-Host "Due Action Outcomes through $logicalDate`: $($outcomeSummary -join ',')"
            if ($failedChecks.Count -ne 0) {
              throw "Deployed lifecycle quality gate failed: $($failedChecks -join ',')"
            }
          } finally {
            Remove-Item -LiteralPath $payloadPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $responsePath -Force -ErrorAction SilentlyContinue
          }

      - name: Recover one failed lifecycle date through governed controller
        if: inputs.action == 'recover-failed-integration-date'
        shell: pwsh
        run: |
          ./ops/extend_stateful_lifecycle_controller_staging.ps1 `
            -Region $env:AWS_REGION `
            -ControllerFunction $env:CONTROLLER_FUNCTION `
            -StartDate "${{ inputs.replay_start_date }}" `
            -Days 1 `
            -MaxElapsedMinutes 50 `
            -ExecutionMode "${{ inputs.execution_mode }}" `
            -ScenarioId "${{ inputs.scenario_id }}" `
            -RetryFailedRun `
            -Apply

      - name: Write staging evidence summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Stateful lifecycle staging"
            echo "- Requested action: \`${{ inputs.action }}\`"
            echo "- Execution mode: \`${{ inputs.execution_mode }}\`"
            echo "- Scenario ID: \`${{ inputs.scenario_id }}\`"
            echo "- Time basis: \`${{ inputs.execution_mode == 'FUTURE_SIMULATION' && 'FUTURE_SIMULATION' || 'ACTUAL_CALENDAR' }}\`"
            echo "- Logical dates: \`${{ inputs.replay_start_date }}\` + ${{ inputs.replay_days }} days"
            echo "- Initial population: \`${{ inputs.population_size }}\`"
            echo "- Integration logical date: \`${{ inputs.integration_logical_date }}\`"
            echo "- Extension safety cap: \`12 dates / 50 elapsed minutes\`"
            echo "- Q4 synthetic configuration only: \`${{ inputs.action == 'deploy-q4-configuration' }}\`"
            echo "- Explicit failed-date recovery: \`${{ inputs.action == 'recover-failed-integration-date' }}\`"
